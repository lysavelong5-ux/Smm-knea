<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM-NOW.com - Facebook & TikTok</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Poppins', sans-serif; }
        .navbar-brand { color: #0d6efd !important; font-weight: bold; }
        .card-stat { border: none; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .btn-platform { border-radius: 8px; font-weight: 500; font-size: 14px; transition: all 0.2s; }
        .btn-platform.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        .form-control, .form-select { border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-light bg-white px-3 shadow-sm">
        <div class="d-flex align-items-center">
            <i class="fa-solid fa-bars fs-4 me-3"></i>
            <a class="navbar-brand fs-4" href="#">SMM-NOW<span class="text-dark">.com</span></a>
        </div>
        <div>
            <i class="fa-regular fa-moon fs-5 me-3" style="cursor: pointer;" onclick="alert('ប្ដូរពណ៌ (Dark Mode)')"></i>
            <span class="badge bg-primary rounded-pill p-2"><i class="fa-solid fa-user"></i></span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-3">

        <!-- User Stats -->
        <div class="row g-2 mb-2">
            <div class="col-6">
                <div class="card card-stat p-3 bg-white">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fa-solid fa-user"></i></div>
                        <div>
                            <h6 class="mb-0 fw-bold">lysavelong5</h6>
                            <small class="text-muted">ឈ្មោះអ្នកប្រើប្រាស់</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card card-stat p-3 bg-white">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fa-solid fa-wallet"></i></div>
                        <div>
                            <h6 class="mb-0 fw-bold" id="user-balance">$0.00</h6>
                            <small class="text-muted">សមតុល្យទឹកប្រាក់</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <div class="card card-stat p-3 bg-white">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fa-solid fa-chart-line"></i></div>
                        <div>
                            <h6 class="mb-0 fw-bold">$0.00</h6>
                            <small class="text-muted">ចំណាយសរុប</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card card-stat p-3 bg-white">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fa-solid fa-box"></i></div>
                        <div>
                            <h6 class="mb-0 fw-bold" id="active-orders-count">0</h6>
                            <small class="text-muted">ការបញ្ជាទិញសកម្ម</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Social Media Buttons (Only Facebook & TikTok) -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <button class="btn btn-light w-100 btn-platform shadow-sm py-2 platform-btn active" data-platform="facebook" onclick="selectPlatform('facebook')">
                    <i class="fa-brands fa-facebook text-primary"></i> Facebook
                </button>
            </div>
            <div class="col-6">
                <button class="btn btn-light w-100 btn-platform shadow-sm py-2 platform-btn" data-platform="tiktok" onclick="selectPlatform('tiktok')">
                    <i class="fa-brands fa-tiktok"></i> TikTok
                </button>
            </div>
        </div>

        <!-- Order Tabs -->
        <div class="row g-2 mb-3">
            <div class="col-6"><button class="btn btn-primary w-100 btn-platform"><i class="fa-solid fa-cart-shopping"></i>បញ្ជាទិញថ្មី</button></div>
            <div class="col-6"><button class="btn btn-light w-100 btn-platform border" onclick="alert('មិនមានទិន្នន័យចំណូលចិត្តទេ')"><i class="fa-solid fa-heart text-danger"></i>ចូលចិត្ត</button></div>
        </div>

        <!-- Order Form Card -->
        <div class="card border-0 shadow-sm p-3 rounded-4">
            <!-- Search -->
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="search-service" class="form-control bg-light border-start-0" placeholder="ស្វែងរកសេវាកម្ម..." onkeyup="filterServices()">
                </div>
            </div>

            <!-- Category -->
            <div class="mb-3">
                <label class="form-label fw-bold small"><i class="fa-solid fa-table-cells text-primary"></i> ប្រភេទ (Category)</label>
                <select class="form-select bg-light" id="category-select">
                    <option id="cat-fb">Facebook - Followers [គណនីពិត - លឿន]</option>
                    <option id="cat-tt" style="display:none;">TikTok - Views & Likes [សេវាកម្មរហ័ស]</option>
                </select>
            </div>

            <!-- Service -->
            <div class="mb-3">
                <label class="form-label fw-bold small"><i class="fa-solid fa-bell-concierge text-primary"></i> សេវាកម្ម (Service)</label>
                <select class="form-select bg-light" id="service-select">
                    <option value="15">11328 - Facebook - Follower ទំព័រ ឬ ប្រវត្តិរូប</option>
                </select>
            </div>

            <!-- Link -->
            <div class="mb-3">
                <label class="form-label fw-bold small"><i class="fa-solid fa-link text-primary"></i> តំណភ្ជាប់ (Link)</label>
                <input type="text" id="order-link" class="form-control bg-light" placeholder="https://...">
            </div>

            <!-- Quantity -->
            <div class="mb-2">
                <label class="form-label fw-bold small"><i class="fa-solid fa-arrow-up-wide-short text-primary"></i> ចំនួន (Quantity)</label>
                <div class="position-relative">
                    <input type="number" id="order-qty" class="form-control bg-light pe-5" placeholder="100" oninput="calculateTotal()">
                    <button class="btn btn-primary position-absolute top-50 end-0 translate-middle-y me-1 rounded-circle" style="width: 35px; height: 35px;" onclick="submitOrder()"><i class="fa-solid fa-paper-plane fs-6"></i></button>
                </div>
                <small class="text-muted mt-1 d-block">អប្បបរមា: 10 - អតិបរមា: 1,000,000</small>
            </div>
            
            <div class="mt-2 text-end">
                <span class="fw-bold text-primary" id="total-price">សរុប: $0.00</span>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPlatform = 'facebook';
        let activeOrders = 0;

        function selectPlatform(platform) {
            currentPlatform = platform;
            
            // ផ្លាស់ប្តូរ Active Class នៅលើប៊ូតុង
            document.querySelectorAll('.platform-btn').forEach(btn => {
                btn.classList.remove('active', 'btn-primary');
                btn.classList.add('btn-light');
            });
            const selectedBtn = document.querySelector(`[data-platform="${platform}"]`);
            selectedBtn.classList.remove('btn-light');
            selectedBtn.classList.add('active', 'btn-primary');

            // ផ្លាស់ប្តូរ Options ក្នុង Category និង Service តាម Platform
            const catFb = document.getElementById('cat-fb');
            const catTt = document.getElementById('cat-tt');
            const serviceSelect = document.getElementById('service-select');

            if (platform === 'facebook') {
                catFb.style.display = 'block';
                catTt.style.display = 'none';
                catFb.selected = true;
                serviceSelect.innerHTML = '<option value="15">11328 - Facebook - Follower ទំព័រ ឬ ប្រវត្តិរូប</option>';
            } else {
                catFb.style.display = 'none';
                catTt.style.display = 'block';
                catTt.selected = true;
                serviceSelect.innerHTML = '<option value="20">20450 - TikTok - Views វីដេអូរហ័ស</option>';
            }
        }

        function calculateTotal() {
            let qty = document.getElementById('order-qty').value;
            let pricePerItem = currentPlatform === 'facebook' ? 0.005 : 0.002;
            let total = qty * pricePerItem;
            document.getElementById('total-price').innerText = `សរុប: $${total.toFixed(2)}`;
        }

        function submitOrder() {
            let link = document.getElementById('order-link').value;
            let qty = document.getElementById('order-qty').value;

            if (!link) {
                alert('សូមបញ្ចូលតំណភ្ជាប់ (Link) ជាមុនសិន!');
                return;
            }
            if (!qty || qty < 10) {
                alert('សូមបញ្ចូលចំនួនយ៉ាងតិច 10!');
                return;
            }

            activeOrders++;
            document.getElementById('active-orders-count').innerText = activeOrders;
            alert('ការបញ្ជាទិញរបស់អ្នកបានជោគជ័យ!');
            
            // សម្អាតទម្រង់បញ្ចូល
            document.getElementById('order-link').value = '';
            document.getElementById('order-qty').value = '';
            document.getElementById('total-price').innerText = 'សរុប: $0.00';
        }

        function filterServices() {
            let input = document.getElementById('search-service').value.toLowerCase();
            // មុខងារស្វែងរកសេវាកម្មអាចបន្ថែមតាមតម្រូវការ
        }
    </script>
</body>
</html>
